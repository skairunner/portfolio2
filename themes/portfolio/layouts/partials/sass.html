<!--Provide dictionary option 'src'-->
{{ $sass := resources.Get .src }}
{{ $options := dict
  "outputStyle" "compressed"
  "transpiler" "dartsass"
}}
{{ $styles := $sass | css.Sass $options | resources.Fingerprint "sha512" }}
<link
  rel="stylesheet"
  href="{{ $styles.RelPermalink }}"
  integrity="{{ $styles.Data.Integrity }}"
/>
